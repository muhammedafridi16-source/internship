<!DOCTYPE html>
<html>
<head>
<title>Laptop Card</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0d1117;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card */
.card {
    width: 300px;
    background: #161b22;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    text-align: center;
    color: white;
    transition: transform 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

/* Image */
.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

/* Content */
.card-content {
    padding: 20px;
}

.card h2 {
    margin: 10px 0;
}

.card p {
    font-size: 14px;
    color: #ccc;
}

/* Button */
button {
    margin-top: 15px;
    padding: 10px 20px;
    background: #238636;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #2ea043;
}
</style>

</head>

<body>

<div class="card">
    <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=400" alt="Laptop">

    <div class="card-content">
        <h2>Laptop</h2>
        <p>High-performance laptop for work, gaming, and everyday use.</p>
        <button>Buy Now</button>
    </div>
</div>

</body>
</html>
