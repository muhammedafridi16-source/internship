<!DOCTYPE html>
<html>
<head>
<title>Display - Mobile Phones</title>

<style>
body {
    font-family: Arial;
    background: #0d1117;
    color: white;
    text-align: center;
}

/* Common box style */
.box {
    padding: 15px;
    margin: 10px;
    border-radius: 8px;
}

/* Block */
.block {
    display: block;
    background: #238636;
}

/* Inline */
.inline {
    display: inline;
    background: #58a6ff;
}

/* Inline-block */
.inline-block {
    display: inline-block;
    width: 180px;
    background: #ff7b72;
}

/* Image */
img {
    width: 100%;
    border-radius: 8px;
}
</style>

</head>

<body>

<h1>Display Property - Mobile Phones</h1>

<!-- Block Example -->
<div class="box block">
    <h3>iPhone</h3>
    <p>Block display (full width)</p>
</div>

<!-- Inline Example -->
<span class="box inline">Samsung</span>
<span class="box inline">OnePlus</span>

<br><br>

<!-- Inline-Block Example -->
<div class="box inline-block">
    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400">
    <p>Mobile 1</p>
</div>

<div class="box inline-block">
    <img src="https://images.unsplash.com/photo-1580910051074-3eb694886505?w=400">
    <p>Mobile 2</p>
</div>

</body>
</html>
