<!DOCTYPE html>
<html>
<head>
<title>Flex Properties</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0d1117;
    color: white;
    text-align: center;
}

/* Flex Container */
.container {
    display: flex;
    justify-content: space-around;   /* horizontal spacing */
    align-items: center;             /* vertical alignment */
    flex-wrap: wrap;                 /* responsive */
    padding: 30px;
    gap: 20px;
}

/* Card */
.card {
    background: #161b22;
    width: 200px;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

/* Image */
.card img {
    width: 100%;
    border-radius: 10px;
}

/* Button */
button {
    margin-top: 10px;
    padding: 8px;
    border: none;
    background: #238636;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #2ea043;
}
</style>

</head>

<body>

<h1>Flexbox - Mobile Phones</h1>

<div class="container">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400">
        <h3>iPhone</h3>
        <button>Buy</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1580910051074-3eb694886505?w=400">
        <h3>Samsung</h3>
        <button>Buy</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1603899122634-ec0c3fcd3c07?w=400">
        <h3>OnePlus</h3>
        <button>Buy</button>
    </div>

</div>

</body>
</html>
