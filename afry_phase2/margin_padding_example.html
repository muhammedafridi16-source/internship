<!DOCTYPE html>
<html>
<head>
<title>Margin & Padding Examples</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0d1117;
    color: white;
    text-align: center;
}

/* Common style */
.box {
    width: 250px;
    margin: 20px auto;
    border-radius: 10px;
}

/* Example 1: Margin */
.box1 {
    background: #238636;
    margin: 50px;   /* space outside */
    padding: 10px;
}

/* Example 2: Padding */
.box2 {
    background: #58a6ff;
    margin: 20px;
    padding: 50px;  /* space inside */
}

/* Example 3: Both */
.box3 {
    background: #ff7b72;
    margin: 40px;
    padding: 30px;
}
</style>

</head>

<body>

<h1>Margin & Padding Examples</h1>

<!-- Example 1 -->
<div class="box box1">
    <h3>Example 1: Margin</h3>
    <p>Margin adds space outside the box</p>
</div>

<!-- Example 2 -->
<div class="box box2">
    <h3>Example 2: Padding</h3>
    <p>Padding adds space inside the box</p>
</div>

<!-- Example 3 -->
<div class="box box3">
    <h3>Example 3: Margin + Padding</h3>
    <p>Both used together</p>
</div>

</body>
</html>
